name: Collect prices

# Off the hour on purpose: GitHub delays or drops scheduled runs under load, worst
# at the top of the hour. The feed republishes every 5 minutes, so a late or
# missed run only coarsens the timing of a change; it doesn't lose the last price.
# Hourly since the repo went public (2026-11-07), where Actions minutes are free.
# Every 3 hours before, while private; GitHub ran only 3 of those 8 a day.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Collect
        run: python3 collect.py

      # Committed each run, not daily: a lost run can't be re-fetched. Plain-text
      # daily files and one-entry-per-line state keep these commits small.
      - name: Commit
        id: commit
        run: |
          git add history state
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "prices: $(python3 -c "import json; print(json.load(open('state/feed.json'))['generated_at'])")"
          git pull -q --rebase
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Rebuilds the 30-day file Tromi backfills from, and deploys only that file to
  # Pages (source: GitHub Actions), so the archive never lands on the site.
  # Inert until the repo variable PUBLISH_PAGES is "true", which waits on the repo
  # going public and Pages being enabled; a failed collect skips it, as does a feed
  # with no change. A failed build (under its station floor) leaves Pages serving
  # the last good file.
  publish:
    needs: collect
    if: ${{ vars.PUBLISH_PAGES == 'true' && (needs.collect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build
        run: python3 publish.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
